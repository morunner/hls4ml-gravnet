[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
name = "hls4ml_gravnet"
version = "0.1.0"
description = "hls4ml GravNet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hls4ml",
    "polars>=1.35.2",
    "quantized-gravnet",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
]
plotting = [
    "matplotlib>=3.10.7",
    "mplhep>=0.4.1",
]

[tool.uv.sources]
hls4ml = { git = "https://github.com/morunner/hls4ml.git", rev = "21378774ac8bc8168708fdcbc256bd93f1c946e1" }
quantized-gravnet = { git = "https://github.com/lorenzo-as/quantized-gravnet.git", rev = "30fa51212d90e6de809db2c6957726bc4af5c480" }

[tool.ruff]
target-version = "py311"

line-length = 125
indent-width = 4
exclude = [ "hls4ml"]

format.quote-style = "single"
format.skip-magic-trailing-comma = false
format.docstring-code-line-length = 125
format.docstring-code-format = true
lint.select = [ "E", "F", "I", "W" ]
lint.ignore = [ "E741" ]
lint.per-file-ignores = { "__init__.py" = [ "F401" ] }

lint.fixable = [ "ALL" ]
lint.unfixable = [  ]

[tool.pytest.ini_options]
norecursedirs = [
    "hls4ml",
]
python_files = "test_*.py generate_test_vectors.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["hls4ml_gravnet*"]
exclude = ["tests*",  "notebooks*", "data*", "hls4ml"]
namespaces = false

[tool.setuptools.package-data]
"hls4ml_gravnet" = ["**/*.h"]
